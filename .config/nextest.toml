# cargo-nextest config — runs ahead of `cargo test` on every recipe
# that touches tests (`just test`, `cargo xtask test`, CI). Profiles
# mirror the bearcove convention so the same flags work across projects.

[profile.default]
# Fail fast — stop on the first failing test so CI iteration is quick.
fail-fast = true

# Show every passing test (default would only show failures). Cheap
# visibility at the cost of a few lines of output.
status-level = "pass"

# 2s soft / 4s hard kill for stuck tests. Native tests in this repo
# all finish in <100ms; anything slow is a bug.
slow-timeout = { period = "2s", terminate-after = 2 }

# CI profile — same as default but verbose for log artifacts.
[profile.ci]
fail-fast = false
status-level = "all"
final-status-level = "flaky"
slow-timeout = { period = "5s", terminate-after = 3 }

# Patient profile — run flaky / network-bound tests with a longer
# leash. Use sparingly.
[profile.patient]
slow-timeout = { period = "30s", terminate-after = 4 }

# Integration suites that spawn a real server (and, for the CLI, real
# subprocesses) over a vox WebSocket take seconds, not the <100ms the
# fast default budget assumes. Give just those packages a longer leash
# in every profile so `just test` doesn't terminate them mid-handshake.
[[profile.default.overrides]]
filter = "package(app-cli) | package(app-tests-e2e)"
slow-timeout = { period = "20s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "package(app-cli) | package(app-tests-e2e)"
slow-timeout = { period = "20s", terminate-after = 2 }
