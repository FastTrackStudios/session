# Session iOS TestFlight — build the Session iPhone app and upload it on
# every push to main that touches the app or the crates it renders with.
#
# Runs on the org-level self-hosted macOS runner `airlock`, which holds its
# own credentials (~/.appstoreconnect + fts-build.keychain), so this needs no
# GitHub secrets.
#
# Reuses the same parameterized deploy-testflight.sh the other products use;
# only the DX_* env below differs.

name: session-ios

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/session-daw/**"
      - "apps/session-watch/**"
      - "crates/session/**"
      - "features/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/session-ios.yml"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "CFBundleShortVersionString (e.g. 0.0.2)"
        required: false
        default: "0.0.1"

# Per-workflow group: a newer run supersedes an older queued one. NOT shared
# across products — a concurrency group holds only one pending run, so a
# shared name makes the products cancel each other (that is exactly how
# task-ios went stale for four merges). Serialization is already guaranteed:
# airlock is a single runner and takes one job at a time.
concurrency:
  group: ios-testflight-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, macos, airlock]
    # Turn a missing runner into a red X within the hour. Without it a job
    # with no available runner sits QUEUED and is eventually cancelled,
    # which reads as "cancelled" rather than "failed" and alerts nobody.
    timeout-minutes: 90
    steps:
      - name: Preflight — build volume mounted
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "ERROR: /Volumes/build-disk is not mounted on this runner." >&2
            exit 1
          fi
          df -h /Volumes/build-disk | tail -1

      # clean:false keeps target/ between runs so cargo builds incrementally.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build, sign, and upload Session (with its watch app) to TestFlight
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          MARKETING_VER: ${{ inputs.marketing_version || '0.0.1' }}
          # 26.6 GM builds/signs/uploads; the beta's actool compiles the icon
          # catalog (26.6's actool can't produce Assets.car on macOS 27).
          ACTOOL_DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
          # ── Telemetry ────────────────────────────────────────────────
          # Baked at build time via option_env! in architect-telemetry: a
          # shipped app has nobody to set env vars for it, and the exporter
          # is built at process start -- before sign-in -- so a session
          # token cannot be the credential. Both empty => the app is
          # telemetry-free, which is the local-first default.
          TASK_OTLP_ENDPOINT: ${{ vars.TASK_OTLP_ENDPOINT }}
          TASK_OTLP_TOKEN: ${{ secrets.TASK_OTLP_TOKEN }}
          TASK_SENTRY_DSN: ${{ secrets.TASK_SENTRY_DSN }}
          # ── Session product identity ─────────────────────────────────
          # The app is apps/desktop, crate `session-desktop` (renamed from
          # `fasttrackstudio` when Session became its own product). Only
          # DX_BUNDLE_ID separates the shipped products, so it must never be
          # left at a default.
          DX_PACKAGE: session-desktop
          DX_APP_DIR: apps/desktop
          # NOT the crate defaults: those add `tts`, which pulls ort/ONNX
          # Runtime -- and ONNX publishes no prebuilt binary for
          # aarch64-apple-ios, so ort-sys' build.rs panics and the whole
          # build dies. Without it the guide runs on synthesized cues.
          # (`session-domain` alone, as this used to say, compiles no Session
          # workspace -- the code gates them on `session`.) `watch` relays
          # the guide feed to the embedded watch app.
          DX_FEATURES: --no-default-features --features session,charts,watch
          DX_BUNDLE_ID: app.fasttrackstudio.session
          APP_DISPLAY_NAME: Session
          PROFILE_NAME: FTS Session App Store
          ICONS_DIR: ${{ github.workspace }}/apps/desktop/ios/Assets.xcassets
          # ── The Session watch app, embedded ──────────────────────────
          # Built unsigned from its XcodeGen project, embedded at
          # <iOS app>/Watch/Session.app and signed inside-out with its own
          # App Store profile (minted, and its bundle id registered, by
          # mint-dev-profile.rb on the first run). The watch build uses the
          # Xcode that has the watchOS device platform installed.
          WATCH_APP: apps/session-watch
          WATCH_SCHEME: SessionWatch
          WATCH_PRODUCT: Session
          WATCH_BUNDLE_ID: app.fasttrackstudio.session.watchkitapp
          WATCH_PROFILE_NAME: FTS Session Watch App Store
          WATCH_XCODE_DIR: /Applications/Xcode-beta.app/Contents/Developer
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          bash apps/desktop/ios/deploy-testflight.sh

      - name: Summary
        if: always()
        run: |
          echo "### Session iOS TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "commit \`$(git rev-parse --short HEAD)\` → Session uploaded (see log for build number)." >> "$GITHUB_STEP_SUMMARY"
