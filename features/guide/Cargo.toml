[package]
name = "session-guide"
version.workspace = true
edition = "2021"  # original edition of the dissolved workspace (root is 2024)
authors.workspace = true
license.workspace = true
description = "Portable guide engine: click track, count-in, and spoken section guide (ported from legacy fts-guide)"

[lints]
workspace = true

[features]
default = []
# Local text-to-speech cue rendering via bearcove's chatterbox (ONNX / ort).
# NOT realtime-safe: cues are pre-rendered to wav at setlist-build time by
# `CueBank` and handed to the engine as preloaded PCM. Loading previously
# cached cues does NOT require this feature (hound handles the wav I/O).
# `ort/load-dynamic`: dlopen libonnxruntime at runtime (via ORT_DYLIB_PATH)
# instead of a downloaded/build-linked binary — the only approach that works
# under Nix's linker. The flake provides onnxruntime and exports ORT_DYLIB_PATH.
tts = ["dep:chatterbox-rs", "dep:ort", "ort/load-dynamic"]

[dependencies]
# Session domain types (Section / Song / Setlist) that the engine's inputs
# map from. Internal crate — apps still go through the `session` facade;
# session-guide is itself part of the session domain.
session-proto.workspace = true

# wav I/O for preloaded PCM samples (click / count / guide voices) and for
# the TTS cue cache. Always on — reading cached cues must not need `tts`.
hound = "3.5"
# Cache key hashing for TTS cues: SHA-256 of (text + voice id).
sha2 = "0.10"

thiserror.workspace = true
tracing.workspace = true

# Optional local TTS (Resemble AI Chatterbox via ONNX Runtime).
chatterbox-rs = { git = "https://github.com/bearcove/cbx", optional = true }
# Not used directly — pins ONNX Runtime to the rc chatterbox-rs was written
# against (rc.12 made `Session` fields private and broke it). This also
# forces smallvec down to 2.0.0-alpha.10 (ort rc.10 pins `=alpha.10`;
# facet-reflect's `^2.0.0-alpha.10` still accepts it).
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false }
