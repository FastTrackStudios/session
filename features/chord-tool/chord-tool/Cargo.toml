[package]
name = "chord-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "chord-tool — the chord-firing panel (Dioxus; runs standalone for iteration, ships as a Blitz REAPER panel)"

[dependencies]
# All theory comes from keyflow — this crate is UI. If something here
# starts computing intervals, it belongs in keyflow::chord::realize
# instead.
keyflow = { workspace = true }
dioxus = { workspace = true }
# Themed primitives — the native <select> ignores the theme, and this is
# the component set the rest of the app styles with.
architect-ui = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The standalone iteration harness (examples/panel.rs) uses the desktop
# renderer; the shipped REAPER panel uses Blitz. See the example's docs
# for what that difference costs you.
dioxus = { workspace = true, default-features = true, features = ["desktop", "launch"] }

[lints]
workspace = true
