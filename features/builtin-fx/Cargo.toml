[package]
name = "builtin-fx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The FTS processors as the session engine's built-in FX: every FTS plugin, run in-process — no CLAP to load."

[lints]
workspace = true

[dependencies]
daw-standalone = { workspace = true }
daw-proto = { workspace = true }
nice-plug = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
num-traits = { workspace = true }
tracing = { workspace = true }
comp-plugin = { workspace = true }
delay-plugin = { workspace = true }
eq-plugin = { workspace = true }
gate-plugin = { workspace = true }
level-plugin = { workspace = true }
limiter-plugin = { workspace = true }
meter-plugin = { workspace = true }
modulation-plugin = { workspace = true }
reverb-plugin = { workspace = true }
saturate-plugin = { workspace = true }
pitch-plugin = { workspace = true }
tune-plugin = { workspace = true }
unison-plugin = { workspace = true }
mic-plugin = { workspace = true }

[dev-dependencies]
# A song to put them in, as the app opens one.
daw-standalone = { workspace = true, features = ["rpp-project", "decode"] }
