[package]
name = "daw-reaper-dioxus-ext-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "REAPER extension cdylib that mounts a deterministic Dioxus panel for visual e2e tests."

[lib]
crate-type = ["cdylib"]
name = "reaper_daw_dioxus_test_panel"
path = "src/lib.rs"

[dependencies]
daw-reaper-dioxus = { workspace = true }
daw-module = { workspace = true }
reaper-low.workspace = true
reaper-high.workspace = true
reaper-macros = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
tracing.workspace = true

[lints.rust]
unsafe_code = "allow"


[lints.rustdoc]
broken_intra_doc_links = "allow"
