[package]
name = "daw-ui"
description = "DAW UI — Dioxus components for DAW integration (mixer, TCP, arrangement, FX browser)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
# `platform::sleep` — the wasm-cfg-split timer seam. The controls' DAW
# subscription waits for a connection, and it has to do that in the browser
# build too, where tokio's timer compiles and panics.
architect = { workspace = true }
# The wait-for-connection delay. Not `tokio::time` and not
# `architect::platform::sleep` (which is `tokio::time` on native): a Dioxus
# panel's futures run on dioxus's own scheduler, and dioxus_native does not
# bring up a tokio runtime — so a tokio timer panics the moment the panel
# opens, which is exactly how it presented. futures-timer's `Delay` owns its
# timer thread and works on any executor. Same reason as `eq-ui`.
futures-timer = "3"
daw-control = { workspace = true }
daw-proto = { workspace = true }
dock-dioxus = { workspace = true, default-features = false }
dock-proto = { workspace = true }
eyre = { workspace = true }

# UI framework (conditional on feature)
dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }

# Input/actions: gesture → action-string keymap for the arrange view's
# zoom/scroll/playhead (both wasm-clean). Enabled by the `web` feature.
input = { workspace = true, optional = true }
input-dioxus = { workspace = true, optional = true }
# The app-agnostic styx keybind-profile format (name/description/version
# + section files) — read-only here, just to list/name the profiles a
# user can pick between (FastTrackStudio/Logic/Ableton/Pro Tools/REAPER);
# no REAPER coupling, same profile data `reaper-input` loads.
input-config-proto = { workspace = true, optional = true }
input-keybinds = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }

tokio = { version = "1", features = ["time"] }

# Optional deps for the `reaper-test-panels` feature — the FTS UI demo
# panels (Native + Desktop renderer toggles) shipped from this crate so any
# extension can mount them without reimplementing the wiring.
daw-module = { workspace = true, optional = true }
daw-reaper-dioxus = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }

# REAPER theme importer (`reaper-theme` feature): maps a .ReaperTheme palette
# + rtconfig params onto our Theme tokens.
daw-theme-reaper = { workspace = true, optional = true }

# The palette. Controls that draw a mark of their own — the input-FX dot —
# take its colour from the same tokens the vector art does, rather than
# inventing a hex beside it.
daw-theme = { workspace = true }

# The vector controls. Every mixer and track-panel control in this crate is
# one of these components; the same components are rasterised to build the
# REAPER theme, which is what keeps the two renderings honest.
#
# `default-features = false` drops resvg/image/dioxus-ssr: rasterising is the
# theme generator's job. Here they render as live SVG.
daw-theme-art = { workspace = true, default-features = false }

[dev-dependencies]
# Real hit-tested pointer events against blitz-dom — the DOM the REAPER
# panels render through. Hover cannot be tested any other way: it is a
# pointer-chain change, not something a synthesized `mouseenter` reproduces.
dioxus-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
# Renders a panel to a string so a test can assert it actually mounted.
# Type-checking a Dioxus component proves nothing about whether it draws.
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }

[features]
default = ["web"]
web = [
    "dep:dioxus",
    "dep:tracing",
    "dock-dioxus/web",
    "dep:input",
    "dep:input-dioxus",
    "dep:input-config-proto",
    "dep:input-keybinds",
]
native = ["dep:dioxus-native"]
# Folder-hierarchy mixer (`widgets::mixer::Mixer`, driven by
# `daw_proto::track::FolderDepthChange`). daw-proto is already a hard dep.
hierarchy = ["web"]
# Import REAPER themes (palette/params → Theme; see theming::reaper_import).
reaper-theme = ["dep:daw-theme-reaper"]
# Ships the `FTS_UI_NATIVE` and `FTS_UI_DESKTOP` panel + action defs that
# render `architect_ui::showcase::Showcase` through the daw-reaper-dioxus host.
reaper-test-panels = [
    "web",
    "dep:daw-module",
    "dep:daw-reaper-dioxus",
    "dep:architect-ui",
]
# The `playground` example: the vector-themeable panels driven by fake
# sample data (no DAW backend), served in the browser via `dx serve`.
# Pulls the dioxus WEB RENDERER (the base `web` feature only enables the
# dioxus dep for rsx, not a renderer).
playground = ["web", "reaper-theme", "dioxus/web", "dioxus/launch"]

# Web-build helpers for the widgets (e.g. knob pointer-lock / coords).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `Location` is needed by the dioxus-web renderer's history module (its own
# fork Cargo declares `History` but not `Location`, and relies on the
# downstream crate to enable it — the fasttrackstudio app does the same).
# web-sys features are additive across the graph, so this is harmless for
# non-web-renderer builds.
web-sys = { version = "0.3", features = ["Window", "Document", "MouseEvent", "EventTarget", "Location"] }

# The browser playground for the DAW panels — `dx serve --example
# playground --platform web --features playground`.
[[example]]
name = "playground"
required-features = ["playground"]

[lints]
workspace = true
