[package]
name = "fts-themer-ui"
description = "Web GUI for editing the FastTrackStudio REAPER theme — live preview, color editing, accent generation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["web"]
# Browser half. fts-themer stays on its no-fs (wasm-clean) build here: the
# editor holds the ini as a string and re-derives the preview from it.
web = ["dioxus/web", "dioxus/fullstack"]
# Server half — the only side that touches disk or decodes images.
server = ["dioxus/server", "dioxus/fullstack", "fts-themer/fs"]

[dependencies]
dioxus = { workspace = true, features = ["lib", "launch", "logger"] }
serde = { workspace = true }

# The editing core, wasm-clean unless `server` turns its fs half on.
fts-themer = { workspace = true, default-features = false }

# The preview renderer: the native main window, already wasm-clean.
daw-ui = { workspace = true, default-features = false, features = [
    "web",
    "reaper-theme",
] }
# The facade types the native components take (Track / Item).
daw-proto = { workspace = true }

[lints]
workspace = true
