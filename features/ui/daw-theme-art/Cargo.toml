[package]
name = "daw-theme-art"
description = "Theme artwork as Dioxus components — rendered to SVG for the web GUI, rasterised to PNG for the REAPER theme"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["render"]
# Rasterising components to PNG (native only — the REAPER theme generator).
# Without it the crate is just the components, which is what the web build
# wants: it renders them as live SVG, not as pictures of SVG.
render = ["dep:resvg", "dep:image", "dep:dioxus-ssr"]

[dependencies]
daw-theme = { workspace = true }
dioxus = { workspace = true, features = ["lib"] }

dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, optional = true }
resvg = { version = "0.45", optional = true }
image = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
resvg = "0.45"
image = { workspace = true }

[[example]]
name = "contact"
required-features = ["render"]

[[example]]
name = "fidelity"
required-features = ["render"]

[[example]]
name = "analyse"
required-features = ["render"]

[[example]]
