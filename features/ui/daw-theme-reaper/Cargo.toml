[package]
name = "daw-theme-reaper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "REAPER theme importer: .ReaperTheme palette, rtconfig globals/params, image-atlas slicing"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
# PNG decode + slicing for the theme image atlases.
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = { workspace = true }

[lints]
workspace = true
