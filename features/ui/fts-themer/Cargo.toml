[package]
name = "fts-themer"
description = "REAPER theme editor core — round-trip .ReaperTheme colors, recolor image sets, generate accent variants"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "fts_themer"
path = "src/lib.rs"

[[bin]]
name = "fts-themer"
path = "src/bin/fts-themer.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The CLI implies the filesystem half.
cli = ["dep:clap", "fs", "shot", "apply", "generate"]
# Filesystem + image work: reading a theme directory, recoloring artwork.
# Off by default for wasm consumers, which edit the ini as a string and get
# their preview from `ReaperTheme::from_sources` — no disk, no image decode.
fs = ["dep:image"]
# Painting a REAPER theme from the canonical FTS theme.
apply = ["fs", "dep:daw-theme"]
# Component-drawn artwork: render the Dioxus art components into the theme.
generate = ["apply", "daw-theme-art/render", "dep:dioxus"]
# Screenshotting a real REAPER on a private X display (Linux/X11).
shot = ["fs", "dep:daw", "daw/test-harness"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
palette = { workspace = true }
# The canonical FTS theme — `fts-themer apply` paints REAPER from it.
daw-theme = { workspace = true, optional = true }
# The collapse thresholds live here — facts about the theme, shared with
# the Dioxus strip so the two cannot drift. `render` (resvg/image) is only
# needed to rasterise, so it rides the `generate` feature.
daw-theme-art = { workspace = true, default-features = false }
dioxus = { workspace = true, optional = true, features = ["lib"] }
image = { workspace = true, optional = true }
# The shared REAPER test harness (VirtualDisplay: Xvfb + WM + capture).
daw = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

[lints]
workspace = true
