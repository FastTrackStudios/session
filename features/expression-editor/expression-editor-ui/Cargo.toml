[package]
name = "expression-editor-ui"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Expression editor GUI — the Melodyne/MPE canvas, toolbar, and inspector as a portable Dioxus surface"

[dependencies]
expression-editor-tools.workspace = true
# The shared scroll/wheel bindings. The editor resolves gestures from the
# same keymap the arrange view and REAPER use rather than hardcoding a
# modifier match, which is how three schemes for one gesture happened.
# Wasm-clean (serde + tracing only), so this does not cost the web build.
input.workspace = true
expression-editor-core = { workspace = true }
# The grid that follows the zoom — named directly because the status bar
# offers its densities, not only because the core re-exports the type.
adaptive-grid = { workspace = true }
level-dsp.workspace = true
# The canonical FTS palette — every colour below comes from here.
daw-theme = { workspace = true }
dioxus = { workspace = true }
# The painter. `anyrender::Scene` is a plain recording of draw commands —
# no window, no GPU, no renderer — so `paint` stays portable and the
# browser build can replay the same scene through whichever anyrender
# backend it has. peniko brings kurbo (paths, affines) with it.
anyrender = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
parley = { workspace = true }
# The widget that hands the painter its box and puts the scene on screen.
# Native only: this is the DOM/renderer seam, and everything above it is
# deliberately free of it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { workspace = true, features = ["custom-widget"] }
dioxus-native-dom = { workspace = true }

[dev-dependencies]
expression-editor-guitarpro.workspace = true
level-dsp.workspace = true
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
# The PNG harness paints the real editor on a headless Blitz DOM via the
# vendored dioxus-test — CPU rasterizer, so it needs no GPU runner.
dioxus-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
