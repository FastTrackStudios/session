[package]
name = "expression-editor-paint"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "The expression editor as an anyrender scene, plus its pointer and key logic — no DOM, no renderer, no dioxus"

[dependencies]
expression-editor-core = { workspace = true }
# The shared scroll/wheel and key bindings, resolved from the same keymap
# the arrange view and REAPER use.
input.workspace = true
# The grid that follows the zoom.
adaptive-grid = { workspace = true }
# The canonical FTS palette — every colour in `theme` comes from here.
daw-theme = { workspace = true }
# The painter. `anyrender::Scene` is a plain recording of draw commands.
anyrender = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
parley = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
