[package]
name = "expression-editor-corpus"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Build-time drum-corpus tooling for the quantize scenario — fetch, probe, synthesize flams, measure onset recall. Produces material; ships none of it."
publish = false

# Nothing in here is linked into a shipped binary, and that is a licence
# constraint rather than a preference. The corpus it builds is CC BY 4.0
# DrumGizmo material (attributable, but bulky) alongside CC BY-NC-ND
# ENST material (internal evaluation only). Keeping the tooling in its
# own crate means no shipped crate can grow a dependency on either by
# accident. See README.md.

[dependencies]
# The detector under test. The corpus exists to measure this one thing.
expression-editor-audio = { workspace = true }
clap = { workspace = true }
# The shared header probe (no features: probe is always on); hound stays
# for per-channel reading and rendering, same version the rest of the
# tree already uses rather than a second opinion.
fts-sample = { workspace = true }
hound = "3.5"
midly = "0.5"

[[bin]]
name = "drum-corpus"
path = "src/main.rs"
