[package]
name = "expression-editor-daw"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Adapter between the expression editor's document and the DAW MIDI API — works against REAPER and standalone alike"

# Depends on the `daw` FACADE, never on a backend. That is what makes
# the same editor drive a live REAPER take and a standalone project
# without knowing which it has.
[dependencies]
expression-editor-tools.workspace = true
daw = { workspace = true }
expression-editor-core = { workspace = true }
facet.workspace = true
facet-styx.workspace = true
level-dsp.workspace = true

[dev-dependencies]
level-dsp.workspace = true
facet-styx.workspace = true
# The standalone backend, so the whole load → edit → write-back loop is
# exercised through the real `Midi` trait with no DAW running.
daw = { workspace = true, features = ["standalone"] }
