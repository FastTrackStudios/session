[package]
name = "expression-editor-audio"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Adapter between the expression editor's document and tune-dsp's analyzed pitch model — the Melodyne surface's data path"

# The audio counterpart of `expression-editor-daw`: one converts a MIDI
# take, this converts an analysis. Both produce the same
# `ExpressionDoc`, which is the whole reason one editor serves both.
[features]
default = []
render = ["tune-dsp/world"]
# The DAW-facing session. Off by default so a wasm or offline consumer
# gets the analysis without the facade.
daw = ["dep:daw", "dep:fts-sample"]

[dependencies]
expression-editor-core = { workspace = true }
# The tool seam. `pitch` on, because this is the crate that produces
# pitch-detected notes, so this is where their `Timed` impl is wanted.
expression-editor-tools = { workspace = true, features = ["pitch"] }
tune-dsp = { workspace = true }
align-dsp = { workspace = true }
realfft = { workspace = true }
daw = { workspace = true, optional = true }
# The shared WAV writer, only needed by the session's render path.
fts-sample = { workspace = true, features = ["write"], optional = true }

[dev-dependencies]
# The round-trip and session tests render and drive the facade, so the
# test build always has both.
expression-editor-audio = { workspace = true, features = ["render", "daw"] }
# The standalone backend, so the whole load → analyse → edit loop runs
# through the real `AudioAccessors` trait with no DAW. That is the point
# of the facade: one session, two hosts.
daw = { workspace = true, features = ["standalone-audio"] }
