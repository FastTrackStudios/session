[workspace]
members = ["crates/*", "tests", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
color-palette = { path = "crates/color-palette" }
music-catalog = { path = "crates/music-catalog" }
dynamic-template-proto = { path = "crates/dynamic-template-proto" }
dynamic-template = { path = "crates/dynamic-template" }

# Monarchy hierarchy framework
monarchy = { git = "https://codeberg.org/FastTrackStudios/monarchy.git", branch = "main" }

# Facet reflection — aligned to the 0.50 line (facet 0.50 / vox 0.10 migration).
# NOTE: monarchy still derives against facet 0.46 internally; its public trait
# surface carries no facet::Facet bounds, so the two facet versions coexist.
facet = { version = "0.50.0-rc.1" }

# architect framework — #[architect::rpc] sync-trait → vox bridge generation.
# Same source form as daw so cargo resolves one architect across the graph.
architect = { git = "https://codeberg.org/FastTrackStudios/architect.git", branch = "main" }

# VOX service framework — consumed from crates.io (upstream facet/vox monorepo).
vox = { version = "0.10.0-rc.1", default-features = false, features = ["runtime"] }

# Sibling repos
daw = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main", features = ["reaper"] }
daw-proto = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
daw-reaper = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
# "audio" is required: daw-standalone's unconditional `sync` module references
# the feature-gated `audio_engine` (compile error with default features).
daw-standalone = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main", features = ["audio"] }
daw-extension-runtime = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }
actions-proto = { git = "https://codeberg.org/FastTrackStudios/input_actions.git", branch = "main" }

# Testing
reaper-test = { git = "https://codeberg.org/FastTrackStudios/daw.git", branch = "main" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.48", features = ["full"] }

# Observability
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"

# ── Vendored patches ──────────────────────────────────────────────────
# moire: FTS fork — tolerates broken frame-pointer chains on NixOS glibc.
# All moire crates must point to the same fork rev to avoid duplicate
# moire-runtime #[ctor] registrations that crash.
[patch."https://github.com/bearcove/moire"]
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }

[patch.crates-io]
# moire: unify crates.io moire with the FTS fork rev, avoiding duplicate
# moire-runtime #[ctor] registrations that crash. (The old dioxus-fork patch
# block is gone: with daw on the facet-0.50 branch, no dioxus crates appear
# in this graph — daw pins upstream DioxusLabs 0.7.9 in its own workspace.)
moire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-macros-noop = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-runtime = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-tokio = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-capture = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-trace-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-types = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wasm = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }
moire-wire = { git = "https://codeberg.org/FastTrackStudios/moire.git", rev = "7a2f1dc" }


[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
dead_code = "allow"

[workspace.lints.clippy]
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
