[package]
name = "session-extension"
version.workspace = true
edition = "2021"  # original edition of the dissolved workspace (root is 2024)
license.workspace = true
description = "Test-only REAPER extension that hosts the session DawModule"

[lib]
crate-type = ["cdylib"]
name = "reaper_session_extension"
path = "src/lib.rs"
test = false

[dependencies]
daw = { workspace = true, features = ["reaper"] }
daw-reaper.workspace = true
daw-extension-runtime.workspace = true
session = { workspace = true, features = ["reaper"] }
eyre.workspace = true
# LAN test server: serves the same router this extension already mounts
# (session::daw_services::layer_services_with_daw(daw_reaper::Reaper)) over
# a real axum WebSocket, so a `daw::test` can prove the exact
# architect::axum_ws::serve_router path `session-desktop --engine` uses
# actually works against a real REAPER, not just Live Mode's in-process
# player. Test-only surface — never touches fts-extensions.
architect = { workspace = true, features = ["server-axum"] }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["net"] }
fragile = "2"
crossbeam-channel = "0.5"
reaper-low.workspace = true
reaper-macros.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
