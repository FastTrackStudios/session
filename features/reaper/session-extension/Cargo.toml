[package]
name = "session-extension"
version.workspace = true
edition = "2021"  # original edition of the dissolved workspace (root is 2024)
license.workspace = true
description = "The Session bridge: a slim REAPER extension serving session and the daw facade on the LAN and over iroh"

[lib]
crate-type = ["cdylib"]
name = "reaper_session_extension"
path = "src/lib.rs"
test = false

[dependencies]
daw = { workspace = true, features = ["reaper"] }
daw-reaper.workspace = true
daw-extension-runtime.workspace = true
session = { workspace = true, features = ["reaper"] }
eyre.workspace = true
# The bridge: the router this extension mounts, served on the LAN (axum
# WebSocket, the path `session-desktop --engine` uses) and over iroh — what
# an iPad, a phone or a page dials.
architect = { workspace = true, features = ["server-axum", "iroh"] }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["net"] }
fragile = "2"
crossbeam-channel = "0.5"
reaper-low.workspace = true
reaper-macros.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
