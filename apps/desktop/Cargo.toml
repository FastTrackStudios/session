[package]
name = "session-desktop"
version = "0.0.2-alpha"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["FastTrackStudio"]

# The Session app: setlists, songs, charts, and the guide. Lives at
# apps/desktop — "fasttrackstudio" stopped being this app's name once
# the repo split made Session its own product (moved from
# apps/fasttrackstudio, package renamed from `fasttrackstudio`).
#
# The session domain is embedded IN-PROCESS: a daw-standalone backend
# (memory-link bootstrap) makes the setlist DATA the app can PLAY --
# transport over songs/sections without REAPER.
#
# Signal and Ignition are NOT linked. Session coordinates them at runtime
# over vox (ws://), which is why this crate has no signal dependency even
# though it drives the engine -- see the repo README.
#
# Fast-iteration build:
#   cargo run -p session-desktop --no-default-features --features charts

[features]
# Two axes here -- Session and Charts. (The monorepo had a third, Signal;
# it ships from the signal repo now.)
default = ["session", "charts"]
# Session on the web build is a REMOTE: the wasm target compiles only the
# wire surface (session-proto's SetlistService clients + session-ui) and
# talks to the network engine's SetlistService over the shared `/vox` link
# (src/session_remote_view.rs). The in-process player (session facade,
# daw-standalone, the guide) is native-only -- those optional deps live
# exclusively in the `cfg(not(target_arch = "wasm32"))` table below, so
# enabling them here is a no-op on the web build.
# `session` = the domain PLUS spoken cues. Split so iOS can take the domain
# without the TTS backend: `tts` pulls ort/ONNX Runtime, which publishes no
# prebuilt binary for aarch64-apple-ios (ort-sys' build.rs panics outright
# with "downloaded binaries not available for target aarch64-apple-ios").
# Desktop behaviour is unchanged -- `session` still implies `tts`.
session = ["session-domain", "tts"]
# Everything Session is except the TTS backend. The iOS build uses this:
#   dx build --no-default-features --features "session-domain,charts"
# The guide still runs; spoken section cues fall back to the synthesized
# guide samples, exactly as they do when FTS_TTS is unset on desktop.
session-domain = [
    "dep:session-proto",
    # Wasm-only collection browser dep (no-op on native — see note above).
    "dep:collection-proto",
    "dep:session-ui",
    "dep:daw-ui",
    "dep:dawfile-reaper",
    "dep:keyflow",
    "dep:keyflow-sync",
    "dep:session",
    "dep:session-guide",
    "dep:daw",
    "dep:daw-control",
    "dep:daw-standalone",
    "dep:session-vault-sync",
    "dep:architect",
    "architect/local",
    # The remote path to the session engine (src/remote.rs, shared with the
    # signal rig views): vox over a WebSocket or iroh p2p.
    "architect/iroh",
    "dep:vox",
    "dep:vox-core",
    "dep:vox-websocket",
    "dep:vox-stream",
    "dep:thiserror",
    "dep:libc",
    "dep:tokio",
    "dep:eyre",
    # --engine mode's /vox server: the axum WebSocket<->vox adapter
    # (architect::axum_ws). `dep:axum` on a target-table-only dependency is
    # a no-op on platforms where that table doesn't declare it (wasm never
    # builds a server) — same trick collection-proto already uses. The
    # matching `architect/server-axum` feature reference is NOT similarly
    # free — Cargo features aren't per-target — so a wasm build of this
    # feature set would also try to pull in axum's server bits and likely
    # fail; nothing currently builds `session-domain` for wasm without
    # trimming it back out first (see `web-stage`'s own `--features
    # signal,session`, which doesn't go through this feature).
    "architect/server-axum",
    "dep:axum",
]
# Charts: keyflow chart writing (the Charts workspace). Keyflow is also pulled
# by Session (chart parsing), so this is additive; a charts-only build gets it
# independently.
charts = ["dep:keyflow"]
# Chatterbox TTS backend for the guide's spoken cues. Auto-enabled by Session.
# Models are NEVER downloaded implicitly; TTS only *activates* at runtime when
# FTS_TTS=1 and a voice wav exists at ~/.config/fts/tts-voice.wav (the flake
# provides onnxruntime + ORT_DYLIB_PATH). Cached cues keep loading regardless;
# without it, cues fall back to the synthesized guide samples.
tts = ["session-guide/tts"]

# Network probe for the engine's SetlistService (the browser remote's wire
# path, natively): `cargo run -p session-desktop --example setlist_probe`.
[dependencies]
utils.workspace = true
tracing.workspace = true
fts-chrome.workspace = true

# Session domain, wire surface — the SetlistService types + generated
# clients (session-proto) compile everywhere, including the wasm remote.
# The in-process player crates (session facade, daw-standalone, the guide)
# are native-only and live in the cfg(not wasm) table below.
session-proto = { workspace = true, optional = true }
keyflow = { workspace = true, optional = true }
# Ordered-collection wire contract (song Library / Setlist / …). Only the
# wasm build uses it (the /{org}/{collection} browser dials the task-server's
# per-org CollectionService), so the actual optional dep lives in the wasm
# target table below; `dep:collection-proto` in the `session` feature is a
# no-op on native (dep absent there) — the same trick daw-standalone uses.

# Service framework — the root workspace's architect + vox (patched to the
# sibling ../architect checkout at the root) so the whole graph shares one
# architect + one vox.
architect = { workspace = true, features = ["vox", "platform"], optional = true }
vox = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-websocket = { workspace = true, optional = true }

eyre = { workspace = true, optional = true }

[dev-dependencies]
# demo_midi_gen: authors the browser keys rig's bundled demo SMFs via
# daw-proto's SMF codec. Example-only — never a runtime dep of the app.
daw-proto.workspace = true

# The same app on every surface: the desktop binary gets the dioxus
# desktop renderer; the web build (dx build --platform web) is the SAME
# UI served over the network — no desktop-only pages. Native extras:
# the engine supervisor (child processes), file prefs, iroh key file.
# The dioxus renderer splits by platform: desktop (wry window chrome) vs
# mobile (the same wry renderer with iOS launch glue, in the ios table
# further down).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
dioxus = { workspace = true, default-features = true, features = ["desktop", "launch"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber.workspace = true
# Telemetry: fmt console logs + optional Sentry + OTLP export (traces,
# logs, metrics). Doubly opt-in — the `otel` cargo feature carries the
# dependency weight, and at runtime nothing exports unless
# OTEL_EXPORTER_OTLP_ENDPOINT is set (http/protobuf, port 4318).
architect-telemetry = { workspace = true, features = ["otel"] }
session-ui = { workspace = true, features = ["desktop"], optional = true }
# The real DAW panels (MixerPanel / ArrangementView) — self-contained,
# wired to the in-process daw facade. `web` = the dioxus (WebView) renderer
# the desktop app uses.
daw-ui = { workspace = true, features = ["web"], optional = true }
# REAPER-project (.rpp) export for the "Open in REAPER" button — the
# standalone project round-trips through dawfile. Native-only.
dawfile-reaper = { workspace = true, optional = true }
# Async runtime: session's in-process engine AND engine mode's server.
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
# Recording Mode: dials the REAPER extension's Unix-domain-socket vox
# link (see reaper_engine.rs) the same way `daw::cli::connect()` does.
vox-stream = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
# `kill(pid, 0)` liveness probe for socket discovery — Unix-only, which
# Recording Mode already is (no REAPER extension on wasm/iOS).
libc = { workspace = true, optional = true }

# ── Session domain, in-process player (feature `session`, native only) ──
# The session facade + the daw-standalone backend that PLAYS the setlist,
# plus the guide engine — all native-only (audio, threads, filesystem).
# The wasm build gets only session-proto + session-ui and drives a
# network engine instead (session_remote_view.rs).
session = { workspace = true, optional = true }
# Guide engine: click / count-in / section cues rendered into the audio
# output through daw-standalone's aux post-render hook. On iOS the
# session-demo feature drives it with default features (no tts/ONNX) into a
# small cpal stream instead.
session-guide = { workspace = true, optional = true }
# Lyric-sync sidecar (TimingMap) reader for the Lyric Sync workspace. Lean
# default features only — no onnx/whisper; alignment is produced offline by
# the `kf` CLI, the app just loads + edits the resulting sidecar.
keyflow-sync = { workspace = true, optional = true }
# DAW domain — facade (daw::get / init_from_parts / LayerRouter) + the
# standalone backend that plays the setlist without REAPER. "audio" is
# required by daw-standalone's unconditional `sync` module (same
# workaround session's dev-deps carry) and drives real cpal output.
# "cli": Recording Mode's REAPER launcher + socket discovery/connect
# (daw::cli::{launch_and_connect, discover_socket, spawn_reaper}) — the
# same code the `daw` CLI itself uses against a live REAPER, reused here
# instead of reimplementing "find or launch REAPER" from scratch.
daw = { workspace = true, optional = true, features = ["cli"] }
# Backend-agnostic transport/track RPC client (play/pause, record toggle,
# position) — used by the Arrangement workspace's mode-specific toolbar
# actions (e.g. Record mode's record-toggle button) without depending on
# a REAPER host.
daw-control = { workspace = true, optional = true }
# "rpp-project"/"rpp-loader": real .RPP parse + audio materialize
# (`project_loader::load_rpp_via_bay`) — the Home page's "Load & Play"
# loads a setlist's songs this way instead of hand-seeding stems.
daw-standalone = { workspace = true, features = ["bootstrap", "audio", "rpp-project", "rpp-loader"], optional = true }
# The Home page's library/setlist scanner — reuses the exact scan/RPP-
# build/note-writing code the `session-vault-sync` and `session-player`
# CLIs already use, rather than re-implementing it here.
session-vault-sync = { path = "../vault-sync", optional = true }

# ── iPhone (dx build --platform ios) — the phone shell ──
[target.'cfg(target_os = "ios")'.dependencies]
dioxus = { workspace = true, default-features = true, features = ["mobile", "launch"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, default-features = true, features = ["web", "launch"] }
session-ui = { workspace = true, features = ["web"], optional = true }
# The collection browser's wire client (CollectionServiceClient + Collection /
# CollectionItem / NodeRef). Wasm-only: this surface exists only in the web
# build. Enabled via the `session` feature's `dep:collection-proto`.
collection-proto = { workspace = true, features = ["vox"], optional = true }
# NO daw-ui here: its daw-control backend is not wasm-clean, and the daw
# panels (Arrangement / Mixer) are native-only workspaces anyway — the
# session feature's "dep:daw-ui" is a no-op on the web build.
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }
# iroh's wasm transport plumbing (remote.rs's EngineTarget::Iroh path) and
# the collection browser's async CollectionService calls.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
# Chart pane: @font-face data URIs for the engraver's embedded fonts.
base64 = { workspace = true }
# getrandom 0.3 (transitive via iroh) needs its js backend on wasm32.
getrandom = { version = "0.3", features = ["wasm_js"] }
