[package]
name = "session-daw-web"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "The Session DAW view in a browser — the web demo's bundle (see session-daw's web_host)"
publish = false

# Only the browser build takes the page's dependencies: on native (a
# workspace-wide build) session-daw's `web` feature would unify into the
# desktop's and compile the browser-only host there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
session-daw = { path = "../session-daw", default-features = false, features = ["web"] }
dioxus = { workspace = true, features = ["web", "launch"] }
tracing = { workspace = true }
tracing-wasm = "0.2"
tracing-subscriber = { workspace = true }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
# The page's query: which share link to open (`main::source`).
web-sys = { workspace = true, features = ["Window", "Location", "UrlSearchParams"] }
js-sys = { workspace = true }

[lints]
workspace = true
