<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="0.55" stop-color="#151517"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#2E9BFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2E9BFF" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse, NOT objectBoundingBox: one light direction shared by
         every element, and — the reason it is mandatory — a horizontal line
         has a zero-height bbox, and SVG does not render an
         objectBoundingBox gradient on a zero-extent box at all. That is
         what made Keyflow's staff lines disappear entirely. -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse"
                    x1="180" y1="200" x2="860" y2="880">
      <stop offset="0" stop-color="#B3DBFF"/>
      <stop offset="0.42" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#0A56C0"/>
    </linearGradient>
    <linearGradient id="spec" gradientUnits="userSpaceOnUse"
                    x1="0" y1="250" x2="0" y2="790">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3DBFF" stop-opacity="0.80"/>
      <stop offset="0.30" stop-color="#2E9BFF" stop-opacity="0.34"/>
      <stop offset="0.78" stop-color="#2E9BFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#2E9BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3DBFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2E9BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#plate)"/>
  <rect width="1024" height="1024" fill="url(#ambient)"/>

  <g filter="url(#halo)" opacity="0.85">
      <path d="M 253.0 288 H 567.0 A 39.0 39.0 0 0 1 606 327.0 V 327.0 A 39.0 39.0 0 0 1 567.0 366 H 253.0 A 39.0 39.0 0 0 1 214 327.0 V 327.0 A 39.0 39.0 0 0 1 253.0 288 Z" fill="#2E9BFF"  />
      <path d="M 369.0 402 H 591.0 A 39.0 39.0 0 0 1 630 441.0 V 441.0 A 39.0 39.0 0 0 1 591.0 480 H 369.0 A 39.0 39.0 0 0 1 330 441.0 V 441.0 A 39.0 39.0 0 0 1 369.0 402 Z" fill="#2E9BFF"  />
      <path d="M 253.0 516 H 695.0 A 39.0 39.0 0 0 1 734 555.0 V 555.0 A 39.0 39.0 0 0 1 695.0 594 H 253.0 A 39.0 39.0 0 0 1 214 555.0 V 555.0 A 39.0 39.0 0 0 1 253.0 516 Z" fill="#2E9BFF"  />
      <path d="M 437.0 630 H 655.0 A 39.0 39.0 0 0 1 694 669.0 V 669.0 A 39.0 39.0 0 0 1 655.0 708 H 437.0 A 39.0 39.0 0 0 1 398 669.0 V 669.0 A 39.0 39.0 0 0 1 437.0 630 Z" fill="#2E9BFF"  />
  </g>
  <g>
      <path d="M 253.0 288 H 567.0 A 39.0 39.0 0 0 1 606 327.0 V 327.0 A 39.0 39.0 0 0 1 567.0 366 H 253.0 A 39.0 39.0 0 0 1 214 327.0 V 327.0 A 39.0 39.0 0 0 1 253.0 288 Z" fill="url(#body)"  />
