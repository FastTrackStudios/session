      <path d="M 253.0 516 H 695.0 A 39.0 39.0 0 0 1 734 555.0 V 555.0 A 39.0 39.0 0 0 1 695.0 594 H 253.0 A 39.0 39.0 0 0 1 214 555.0 V 555.0 A 39.0 39.0 0 0 1 253.0 516 Z" fill="url(#body)"  />
      <path d="M 437.0 630 H 655.0 A 39.0 39.0 0 0 1 694 669.0 V 669.0 A 39.0 39.0 0 0 1 655.0 708 H 437.0 A 39.0 39.0 0 0 1 398 669.0 V 669.0 A 39.0 39.0 0 0 1 437.0 630 Z" fill="url(#body)"  />
  </g>
  <g>
      <path d="M 253.0 288 H 567.0 A 39.0 39.0 0 0 1 606 327.0 V 327.0 A 39.0 39.0 0 0 1 567.0 366 H 253.0 A 39.0 39.0 0 0 1 214 327.0 V 327.0 A 39.0 39.0 0 0 1 253.0 288 Z" fill="url(#spec)"  />
      <path d="M 369.0 402 H 591.0 A 39.0 39.0 0 0 1 630 441.0 V 441.0 A 39.0 39.0 0 0 1 591.0 480 H 369.0 A 39.0 39.0 0 0 1 330 441.0 V 441.0 A 39.0 39.0 0 0 1 369.0 402 Z" fill="url(#spec)"  />
      <path d="M 253.0 516 H 695.0 A 39.0 39.0 0 0 1 734 555.0 V 555.0 A 39.0 39.0 0 0 1 695.0 594 H 253.0 A 39.0 39.0 0 0 1 214 555.0 V 555.0 A 39.0 39.0 0 0 1 253.0 516 Z" fill="url(#spec)"  />
      <path d="M 437.0 630 H 655.0 A 39.0 39.0 0 0 1 694 669.0 V 669.0 A 39.0 39.0 0 0 1 655.0 708 H 437.0 A 39.0 39.0 0 0 1 398 669.0 V 669.0 A 39.0 39.0 0 0 1 437.0 630 Z" fill="url(#spec)"  />
  </g>
</svg>
