[package]
name = "session-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Dioxus UI components for session management"

[lib]
test = false

[dependencies]
# Session types and service clients
session-proto = { workspace = true }

# DAW types (for PlayState, etc.)
daw-proto = { workspace = true }

# Chart transposition / notation types (the `keyflow::transpose` service lives
# in keyflow-proto, always re-exported by the facade — no engraver weight).
keyflow = { workspace = true, default-features = false }

# FTS UI components
architect-ui.workspace = true

# Dock panel registration
dock-dioxus = { workspace = true, default-features = false }
dock-proto.workspace = true

# Dioxus UI framework
dioxus = { workspace = true, optional = true }

# Icons
lucide-dioxus = { workspace = true }

# Logging
tracing = "0.1"

# Error handling
eyre = "0.6"

[features]
default = ["web"]
# Web/desktop (WebView-based) rendering
web = ["dioxus", "dock-dioxus/web"]
# Desktop app (WebView-based Dioxus desktop)
desktop = ["dioxus", "dock-dioxus/web"]

# WASM dependencies for timing
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance"] }

# Native-only: the dynamic-template auto-organizer (monarchy sort → instrument
# folders). It transitively pulls daw-reaper (REAPER FFI + tokio-net), which
# does not build for wasm32, so the mixer target-gates it and uses a built-in
# taxonomy classifier on the wasm app. Both paths yield the same folder tree.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dynamic-template = { workspace = true }

[dev-dependencies]
# Integration test (tests/navigation.rs): a real in-process daw-standalone +
# session setlist backend driving these exact components through
# dioxus-test's headless blitz-dom renderer — no `session` dependency
# above (this crate stays UI-only), only here. `session` does not depend
# on `session-ui`, so this is not a cycle.
session = { workspace = true }
daw = { workspace = true }
daw-proto = { workspace = true }
daw-standalone = { workspace = true, features = ["bootstrap"] }
architect = { workspace = true, features = ["vox", "platform"] }
vox = { workspace = true }
# Vendored DioxusLabs/dioxus-test — headless component tests on blitz-dom,
# no browser (see Cargo.toml's own comment on the workspace entry).
dioxus-test = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
