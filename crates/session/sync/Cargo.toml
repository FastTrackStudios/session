[package]
name = "session-sync"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The live session as a Loro document: its schema, and the diff between it and the engine"

[features]
default = []
# The bridge to a live daw project, through daw-control.
engine = ["dep:daw-control", "dep:daw-proto", "dep:eyre"]
# Hosting and joining a session over vox (architect's crdt sync).
net = ["dep:crdt", "dep:architect", "dep:uuid", "dep:futures", "dep:vox", "dep:eyre", "dep:tracing", "dep:facet"]

[dependencies]
loro.workspace = true
# The shared clock, positions and drift correction (backend-agnostic).
daw-transport-sync.workspace = true
daw-control = { workspace = true, optional = true }
daw-proto = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
crdt = { workspace = true, optional = true, features = ["vox"] }
architect = { workspace = true, optional = true, features = ["vox", "local", "platform"] }
uuid = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
vox = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
facet = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
crdt = { workspace = true, features = ["vox"] }
architect = { workspace = true, features = ["vox", "local"] }

[lib]
doctest = false

[lints]
workspace = true
