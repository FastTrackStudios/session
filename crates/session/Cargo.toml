[package]
name = "session"
version = "0.1.0"
edition = "2024"

[lib]
name = "session"
path = "src/lib.rs"

[[bin]]
name = "session"
path = "src/main.rs"

[dependencies]
session-proto = { path = "../session-proto" }
actions-proto.workspace = true
architect.workspace = true
daw = { workspace = true, features = ["file", "reaper"] }
daw-proto = { workspace = true }
daw-reaper = { workspace = true }
daw-synchronization.workspace = true
# Raw REAPER FFI — used by take_ranking for cursor / item / take-marker ops
# that aren't covered by the daw service traits.
reaper-high = { workspace = true }
reaper-low = { workspace = true }
reaper-medium = { workspace = true }
dynamic-template.workspace = true
vox.workspace = true
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros"] }
moire.workspace = true
eyre.workspace = true
tracing.workspace = true
chrono = "0.4"
utils.workspace = true
uuid = { version = "1", features = ["v4"] }
keyflow = { workspace = true, features = ["text"] }
keyflow-daw-analysis = { workspace = true }
smallvec = "1.13"
rustc-hash = "2"

[dev-dependencies]
daw = { workspace = true, features = ["standalone", "file"] }
reaper-test.workspace = true
eyre.workspace = true
