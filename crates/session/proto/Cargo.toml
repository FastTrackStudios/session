[package]
name = "session-proto"
version = "0.1.0"
edition = "2024"
license.workspace = true

[package.metadata.cargo-shear]
# `uuid` is only referenced inside the `utils::typed_uuid_id!` macro
# expansion — cargo-shear can't see through macro bodies.
ignored = ["uuid"]

[features]
default = ["vox"]
vox = []

[dependencies]
vox.workspace = true
vox-types.workspace = true
architect = { workspace = true, features = ["vox"] }
facet.workspace = true
daw-proto.workspace = true
keyflow.workspace = true
utils.workspace = true
# Used inside the `utils::typed_uuid_id!` macro expansion (SongId/SectionId) —
# cargo-shear can't see through macro bodies, hence not flagged as used.
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
serde.workspace = true
eyre.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Wire-codec roundtrip tests (facet 0.50 successor to the old vox_postcard).
facet-postcard.workspace = true

[lib]
doctest = false

[lints]
workspace = true
