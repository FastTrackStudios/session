[package]
name = "session"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "session"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "session"
path = "src/main.rs"

[dependencies]
session-proto.workspace = true
# `platform` = the portable async-runtime seam (`architect::platform::{spawn,
# sleep, timeout}` — tokio on native, browser timers/`spawn_local` on wasm),
# replacing the retired moire.
architect = { workspace = true, features = ["platform"] }
# Base (wasm-safe) daw facade: proto + control + module only. The REAPER +
# file backends are native-only and added in the `cfg(not(wasm32))` target
# table below (Cargo unions the two entries on native). The browser setlist
# engine drives the backend-agnostic `daw::get()` facade, so it needs no
# REAPER feature.
daw = { workspace = true }
daw-proto = { workspace = true }
# Canonical 128-slot group partition lives here (music_catalog::groups).
# Guide schedule + MIDI note rendering (the pure half of guide
# generation; this crate does the DAW writes).
session-guide.workspace = true
# <KEYSIG> read/write for the bake step.
dawfile-reaper.workspace = true
music-catalog.workspace = true
# Auto-colour classification: monarchy sorts track names into the group
# hierarchy, color-palette carries the Color type the palette is keyed in.
monarchy.workspace = true
color-palette.workspace = true
# Base (wasm-safe) vox runtime. `transport-local` (Unix-socket / tokio-net,
# pulls mio) is native-only — added in the target table below.
vox = { workspace = true }
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros"] }
eyre.workspace = true
tracing.workspace = true
chrono = "0.4"
utils.workspace = true
uuid = { version = "1", features = ["v4"] }
keyflow = { workspace = true, features = ["text"] }
keyflow-daw-analysis = { workspace = true }
smallvec = "1.13"
rustc-hash = "2"

# Native-only backends. The REAPER FFI + file/reaper daw backends, the
# SynchronizationEngine (itself REAPER-linked), the raw reaper-rs crates
# (used by `take_ranking`), `dynamic-template` (native template engine, used
# by `daw_module` / `track_manager_actions`), and vox's `transport-local`
# (Unix-socket transport → tokio-net → mio) do not build for wasm32. The
# browser build gets none of these; the corresponding session modules are
# `#[cfg(not(target_arch = "wasm32"))]`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
daw = { workspace = true, features = ["file", "reaper"] }
daw-reaper = { workspace = true }
# Pre-roll / record / grouping / take-ranking / auto-colour actions —
# generic DAW operations, moved out of this crate.
daw-actions = { workspace = true }
daw-synchronization.workspace = true
# Raw REAPER FFI — used by take_ranking for cursor / item / take-marker ops
# that aren't covered by the daw service traits.
reaper-high = { workspace = true }
reaper-low = { workspace = true }
reaper-medium = { workspace = true }
dynamic-template.workspace = true
vox = { workspace = true, features = ["transport-local"] }

# Wasm-only: the browser setlist pump drives its single-threaded reactive loop
# with `futures::select!` + fused `architect::platform::sleep` timers (the
# native pump uses `tokio::select!` + `tokio::time::interval`, neither of which
# builds for the browser runtime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { workspace = true }

[dev-dependencies]
daw = { workspace = true, features = ["standalone", "file", "test-harness"] }
# Ephemeral, REAPER-free harness: drive the SetlistService build path against
# an in-process daw-standalone backend over a vox memory link.
# "audio" is required: daw-standalone's unconditional `sync` module references
# the feature-gated `audio_engine` (compile error with default features) —
# same workaround dynamic-template carries.
daw-standalone = { workspace = true, features = ["bootstrap", "audio"] }
daw-proto = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
eyre.workspace = true
# `compare_sections` example reads the legacy `manifest.json`.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
