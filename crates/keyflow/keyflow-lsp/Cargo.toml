[package]
name = "keyflow-lsp"
version.workspace = true
edition = "2021"  # original edition of the dissolved workspace (root is 2024)
authors.workspace = true
license.workspace = true
description = "Language Server Protocol server for Keyflow chart notation"

[[bin]]
name = "keyflow-lsp"
path = "src/main.rs"

[dependencies]
keyflow-text = { workspace = true, features = ["highlighting"] }
keyflow-syntax = { workspace = true, features = ["highlighting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tower-lsp = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"

[lints]
workspace = true
