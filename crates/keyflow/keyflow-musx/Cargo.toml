[package]
name = "keyflow-musx"
version.workspace = true
edition = "2021"  # matches keyflow-musicxml (dissolved-workspace edition)
description = "Finale .musx → MusicXML converter (Rust port of joris-vaneyghen/musx2mxl)"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
roxmltree = "0.20"
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
keyflow-musicxml.workspace = true
# examples/convert_batch.rs — parallel batch conversion (example-only dep,
# the library itself stays dependency-light).
rayon = "1"

[lints]
workspace = true
